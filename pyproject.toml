[project]
name = "construction-platform"
version = "0.1.0"
description = "Construction Site Operations Platform — production-grade SaaS backend"
readme = "README.md"
authors = [
    { name = "paipragathi", email = "paipragathi007@gmail.com" }
]
requires-python = ">=3.13"

dependencies = [
    # ── Web Framework ──────────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.17",

    # ── Database ───────────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # ── Validation & Configuration ─────────────────────────────────────────────
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",

    # ── Authentication ─────────────────────────────────────────────────────────
    "pyjwt[crypto]>=2.10.0",
    "bcrypt>=4.2.0",
    "cryptography>=44.0.0",

    # ── Logging ────────────────────────────────────────────────────────────────
    "structlog>=24.4.0",

    # ── Redis ──────────────────────────────────────────────────────────────────
    "redis[hiredis]>=5.2.0",

    # ── Celery Task Queue ──────────────────────────────────────────────────────
    "celery[redis]>=5.4.0",
    "flower>=2.0.0",

    # ── Object Storage (S3 / MinIO) ───────────────────────────────────────────
    "boto3>=1.35.0",
    "aioboto3>=13.0.0",

    # ── Observability ──────────────────────────────────────────────────────────
    "prometheus-fastapi-instrumentator>=7.0.0",
    "prometheus-client>=0.21.0",

    # ── Utilities ──────────────────────────────────────────────────────────────
    "httpx>=0.28.0",
    "python-dateutil>=2.9.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "testcontainers[postgres,redis]>=4.8.0",
    "factory-boy>=3.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "types-redis>=4.6.0",
    "sqlalchemy[mypy]>=2.0.36",
]

# NOT installed in production API image — only in the dedicated OCR worker image
ocr = [
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.8.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=11.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = [
    "B008",   # FastAPI uses function calls in argument defaults
    "ARG001", # unused function argument — common in abstract method overrides
    "ARG002", # unused method argument
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
